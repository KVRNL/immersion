name: Bug report
description: Something in Immersion isn't working right
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill this in so we can reproduce it.

        **Security issue?** Don't post it here — use https://kvrnl.io/contact/ instead.
  - type: input
    id: version
    attributes:
      label: Immersion version
      description: Shown in the app's About screen
      placeholder: "e.g. 1.0.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Immersion
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Drag images straight into this box. Paste any error text.
    validations:
      required: false
